# CxChanger - safer four-tool Klipper macro adaptation
# Based on ers-ye/cxchanger/klipper/toolchange.cfg (reviewed 2026-10-09).
# Board pins and dock coordinates are machine-specific. Motion is disabled by default.

[save_variables]
filename: ~/printer_data/config/myvariables.cfg

# Never blindly restore a saved mounted-tool state after power loss or manual removal.
[delayed_gcode CX_INITIALIZE_TOOL_STATE]
initial_duration: 0.2
gcode:
    SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE=-1
    SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
    M118 [CxChanger] Startup state set to -1; verify physical tool state before printing.

# EXAMPLE PIN ONLY. Upstream active pin is PC14 although one comment mentions expander:PA9.
# Replace PC14 with the actual pin/polarity for your controller before use.
[filament_switch_sensor tool_sensor]
switch_pin: PC14
pause_on_runout: False
runout_gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% if cfg.enable_sensor_check|int == 1 %}
        { action_respond_info("[CxChanger] Filament/runout sensor event; pausing.") }
        PAUSE
    {% else %}
        M118 [CxChanger] Sensor event ignored because enable_sensor_check=0.
    {% endif %}
insert_gcode:
    { action_respond_info("[CxChanger] Filament detected/inserted.") }

# Central settings. These dock centers are upstream sample values, not universal coordinates.
[gcode_macro _toolchanger_cfg]
description: CxChanger configuration variables
variable_motion_enabled: 0
variable_tool_count: 4
# The upstream mechanism is XY-actuated. Keep Z hop at 0 unless selected CAD explicitly allows it.
variable_z_hop: 0.0
variable_feed_z: 600                  # mm/min
variable_feed_fast: 3600              # mm/min: 60 mm/s conservative starting profile
variable_feed_slow: 900               # mm/min: 15 mm/s engagement test speed
variable_return_speed: 80             # mm/s for RESTORE_GCODE_STATE MOVE=1
variable_accel_toolchange: 1500       # mm/s^2; reduce further for first tests
variable_dock_shift_x: -3.0           # mm; mechanical HGX lever release/clamp motion
variable_dock_dodge_y: 14.0           # mm; Y withdrawal/approach offset
variable_dock_safe_y: 30.0            # mm; entry/exit clearance

# Upstream example coordinates - replace after physical measurement.
variable_t0_dock_x: 232.0
variable_t0_dock_y: -20.0
variable_t1_dock_x: 202.0
variable_t1_dock_y: -20.0
variable_t2_dock_x: 172.0
variable_t2_dock_y: -20.0
variable_t3_dock_x: 142.0
variable_t3_dock_y: -20.0

# Avoid stacking unknown purge/retraction during commissioning.
variable_pickup_retract_len: 0.0
variable_swap_retract_len: 0.0
variable_swap_prime_len: 0.0
variable_swap_retract_spd: 600.0     # mm/min
variable_enable_sensor_check: 0
gcode:
    # Configuration storage only.

[gcode_macro _tool_status]
variable_current_tool: -1
gcode:
    # Runtime state only; verify physical state after restart or interruption.

[gcode_macro T0]
description: Pick up T0 (motion requires motion_enabled=1)
gcode: change_tool T=0
[gcode_macro T1]
description: Pick up T1 (motion requires motion_enabled=1)
gcode: change_tool T=1
[gcode_macro T2]
description: Pick up T2 (motion requires motion_enabled=1)
gcode: change_tool T=2
[gcode_macro T3]
description: Pick up T3 (motion requires motion_enabled=1)
gcode: change_tool T=3
[gcode_macro UNTOOL]
description: Return current tool to its dock (motion requires motion_enabled=1)
gcode: change_tool T=-1

# Use only after visually confirming what is physically attached/parked.
[gcode_macro CX_RECONCILE_STATE]
description: Reconcile software tool state after restart/E-stop; inspect hardware first
gcode:
    {% set t = params.TOOL|default(-1)|int %}
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% if t < -1 or t >= cfg.tool_count|int %}
        { action_raise_error("CX_RECONCILE_STATE supports TOOL=-1 or TOOL=0..3.") }
    {% else %}
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE={t}
        SAVE_VARIABLE VARIABLE=current_tool VALUE={t}
        M118 [CxChanger] Software state set to {t}; confirm this matches physical hardware.
    {% endif %}

[gcode_macro _release_tool]
description: Low-level release path; only call from change_tool
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set tool = params.TOOL|int %}
    {% set prefix = "t" ~ tool %}
    {% set active_extruder = printer.toolhead.extruder %}
    {% set dock_x = cfg[prefix ~ "_dock_x"]|float %}
    {% set dock_y = cfg[prefix ~ "_dock_y"]|float %}
    {% set shift_x = cfg.dock_shift_x|float %}
    {% set dodge_y = cfg.dock_dodge_y|float %}
    {% set safe_y = cfg.dock_safe_y|float %}
    {% set cur_temp = printer[active_extruder].temperature|float %}
    {% set min_temp = printer.configfile.settings[active_extruder].min_extrude_temp|default(170)|float %}
    M118 [CxChanger] Releasing T{tool}
    {% if cfg.swap_retract_len|float > 0 and cur_temp >= min_temp %}
        M83
        G1 E-{cfg.swap_retract_len} F{cfg.swap_retract_spd}
    {% endif %}
    G90
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}
    G0 X{dock_x} Y{dock_y} F{cfg.feed_fast}
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow}
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow}
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_slow}
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}
    M400

[gcode_macro _pickup_tool]
description: Low-level pickup path; only call from change_tool
gcode:
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set tool = params.TOOL|int %}
    {% set prefix = "t" ~ tool %}
    {% set current_heater = "extruder" if tool == 0 else ("extruder" ~ tool) %}
    {% set dock_x = cfg[prefix ~ "_dock_x"]|float %}
    {% set dock_y = cfg[prefix ~ "_dock_y"]|float %}
    {% set shift_x = cfg.dock_shift_x|float %}
    {% set dodge_y = cfg.dock_dodge_y|float %}
    {% set safe_y = cfg.dock_safe_y|float %}
    {% set cur_temp = printer[current_heater].temperature|float %}
    {% set min_temp = printer.configfile.settings[current_heater].min_extrude_temp|default(170)|float %}
    M118 [CxChanger] Picking up T{tool}
    G90
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}
    G0 X{dock_x} Y{dock_y + dodge_y} F{cfg.feed_fast}
    G0 X{dock_x + shift_x} Y{dock_y + dodge_y} F{cfg.feed_slow}
    G0 X{dock_x + shift_x} Y{dock_y} F{cfg.feed_slow}
    G0 X{dock_x} Y{dock_y} F{cfg.feed_slow}
    {% if cur_temp >= min_temp and cfg.swap_prime_len|float > 0 %}
        M83
        G1 E{cfg.swap_prime_len} F{cfg.swap_retract_spd}
    {% endif %}
    {% if cur_temp >= min_temp and cfg.pickup_retract_len|float > 0 %}
        M83
        G1 E-{cfg.pickup_retract_len} F{cfg.swap_retract_spd}
    {% endif %}
    G0 X{dock_x} Y{dock_y + safe_y} F{cfg.feed_fast}
    M400

[gcode_macro _VERIFY_TOOL_AND_ENABLE_SENSOR]
description: Optional filament/runout-based pickup confirmation
gcode:
    {% set new_tool = params.NEW_TOOL|int %}
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% if cfg.enable_sensor_check|int == 0 %}
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
        SAVE_VARIABLE VARIABLE=current_tool VALUE={new_tool}
        M118 [CxChanger] Sensor check disabled; visual coupling verification remains required.
    {% else %}
        {% set has_filament = printer["filament_switch_sensor tool_sensor"].filament_detected %}
        {% if has_filament %}
            SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=1
            SAVE_VARIABLE VARIABLE=current_tool VALUE={new_tool}
            {% set svv = printer.save_variables.variables %}
            {% set n = svv.total_tool_changes|default(0)|int + 1 %}
            SAVE_VARIABLE VARIABLE=total_tool_changes VALUE={n}
            M118 [CxChanger] Sensor indicates filament present; change recorded.
        {% else %}
            SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
            { action_respond_info("CxChanger pickup is unverified (or filament is absent). Inspect physically before resuming.") }
            PAUSE
        {% endif %}
    {% endif %}

[gcode_macro change_tool]
description: CxChanger main state machine; motion disabled until deliberate enable
gcode:
    {% set new_tool = params.T|default(-1)|int %}
    {% set old_tool = printer["gcode_macro _tool_status"].current_tool|int %}
    {% set cfg = printer["gcode_macro _toolchanger_cfg"] %}
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% set accel_restore = printer.toolhead.max_accel|float %}
    {% if cfg.motion_enabled|int != 1 %}
        { action_raise_error("CxChanger motion is disabled. Complete physical dry-runs, then explicitly set motion_enabled=1.") }
    {% elif 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("CxChanger requires X, Y and Z homed.") }
    {% elif new_tool < -1 or new_tool >= cfg.tool_count|int %}
        { action_raise_error("Invalid CxChanger tool index; supported values are -1 (UNTOOL) and T0-T3.") }
    {% elif new_tool != old_tool and cfg.z_hop|float > 0 and cur_z + cfg.z_hop|float > max_z %}
        { action_raise_error("Configured CxChanger Z hop would exceed Z maximum.") }
    {% elif new_tool == old_tool %}
        M118 [CxChanger] Requested state already active ({new_tool}); no movement.
    {% else %}
        SAVE_GCODE_STATE NAME=cx_toolchange
        SET_VELOCITY_LIMIT ACCEL={cfg.accel_toolchange}
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
        SET_GCODE_OFFSET X=0 Y=0 Z=0
        {% if cfg.z_hop|float > 0 %}
            G91
            G0 Z{cfg.z_hop} F{cfg.feed_z}
            G90
        {% endif %}
        {% if old_tool >= 0 %}
            _release_tool TOOL={old_tool}
        {% endif %}
        {% if new_tool >= 0 %}
            {% set next_heater = "extruder" if new_tool == 0 else ("extruder" ~ new_tool) %}
            {% set target_temp = printer[next_heater].target|float %}
            {% if target_temp > 0 and printer[next_heater].temperature|float < target_temp - 2.0 %}
                TEMPERATURE_WAIT SENSOR={next_heater} MINIMUM={target_temp - 2.0}
            {% endif %}
            _pickup_tool TOOL={new_tool}
        {% endif %}
        M400
        # Critical fix: physically return from dock to saved XYZ. Verify full path is clear first.
        RESTORE_GCODE_STATE NAME=cx_toolchange MOVE=1 MOVE_SPEED={cfg.return_speed}
        SET_VELOCITY_LIMIT ACCEL={accel_restore}
        SET_GCODE_VARIABLE MACRO=_tool_status VARIABLE=current_tool VALUE={new_tool}
        {% if new_tool >= 0 %}
            {% set svv = printer.save_variables.variables %}
            {% set off_x = svv["t" ~ new_tool ~ "_offset_x"]|default(0.0)|float %}
            {% set off_y = svv["t" ~ new_tool ~ "_offset_y"]|default(0.0)|float %}
            {% set off_z = svv["t" ~ new_tool ~ "_offset_z"]|default(0.0)|float %}
            SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0
            _VERIFY_TOOL_AND_ENABLE_SENSOR NEW_TOOL={new_tool}
        {% else %}
            SAVE_VARIABLE VARIABLE=current_tool VALUE=-1
            SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
            SET_GCODE_OFFSET X=0 Y=0 Z=0 MOVE=0
            M118 [CxChanger] Tool unloaded; inspect if state is uncertain after an interruption.
        {% endif %}
    {% endif %}

[gcode_macro GET_TOOL_CHANGE_COUNT]
description: Show saved successful tool-change count
gcode:
    {% set svv = printer.save_variables.variables %}
    {% set n = svv.total_tool_changes|default(0)|int %}
    M118 [CxChanger] Recorded changes: {n}

[gcode_macro RESET_TOOL_CHANGE_COUNT]
description: Reset tool-change count
gcode:
    SAVE_VARIABLE VARIABLE=total_tool_changes VALUE=0
    M118 [CxChanger] Tool-change count reset.

[gcode_macro DISABLE_TOOL_SENSOR]
description: Disable runout/pickup sensor checking
gcode:
    SET_GCODE_VARIABLE MACRO=_toolchanger_cfg VARIABLE=enable_sensor_check VALUE=0
    SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
    M118 [CxChanger] Sensor checks disabled.

[gcode_macro ENABLE_TOOL_SENSOR]
description: Enable sensor checking after polarity and behavior validation
gcode:
    SET_GCODE_VARIABLE MACRO=_toolchanger_cfg VARIABLE=enable_sensor_check VALUE=1
    {% set cur = printer["gcode_macro _tool_status"].current_tool|int %}
    {% if cur >= 0 %}
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=1
    {% else %}
        SET_FILAMENT_SENSOR SENSOR=tool_sensor ENABLE=0
    {% endif %}
    M118 [CxChanger] Sensor policy enabled; sensor activates only with an active tool.

[gcode_macro M109]
rename_existing: CX_M109_BASE
description: Wait for selected hotend heater (supports T0-T3)
gcode:
    {% set s = params.S|default(0)|float %}
    {% set r = params.R|default(0)|float %}
    {% set target_temp = s if s > 0 else r %}
    {% set t = params.T|default(-1)|int %}
    {% if t == -1 %}
        {% set t = printer["gcode_macro _tool_status"].current_tool|int %}
    {% endif %}
    {% if target_temp > 0 and t >= 0 %}
        M104 S{target_temp} T{t}
        {% set sensor = "extruder" if t == 0 else ("extruder" ~ t) %}
        TEMPERATURE_WAIT SENSOR={sensor} MINIMUM={target_temp - 1.0}
    {% else %}
        CX_M109_BASE {rawparams}
    {% endif %}
