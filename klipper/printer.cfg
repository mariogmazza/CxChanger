[gcode_macro PAUSE]
rename_existing: BASE_PAUSE
gcode:
    # ----- English note: refer to README.md for configuration guidance.
    {% set z_hop = 5.0 %}           ;  (mm)
    {% set x_park = 10.0 %}         ;  X 
    {% set y_park = 10.0 %}         ;  Y 
    {% set retract_len = 0 %}     ;  (mm)
    
    # 1. English note: refer to README.md for configuration guidance.
    SAVE_GCODE_STATE NAME=PAUSE_state
    
    # 2. English note: refer to README.md for configuration guidance.
    BASE_PAUSE
    
    # 3. English note: refer to README.md for configuration guidance.
    {% if printer.extruder.can_extrude %}
        M83                          ; 
        G1 E-{retract_len} F2100     ; 
    {% endif %}
    
    # 4. English note: refer to README.md for configuration guidance.
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set cur_z = printer.toolhead.position.z|float %}
    {% if cur_z < (max_z - z_hop) %}
        {% set z_safe = z_hop %}
    {% else %}
        {% set z_safe = max_z - cur_z %}
    {% endif %}

    G91                              ; 
    G1 Z{z_safe} F900                ;  Z ，
    
    # 5. English note: refer to README.md for configuration guidance.
    G90                              ; 
    G1 X{x_park} Y{y_park} F18000    ; 
    
    M118 [System] Parked safely; waiting for user intervention...

[gcode_macro RESUME]
rename_existing: BASE_RESUME
gcode:
    {% set retract_len = 0 %}      ;  PAUSE 
    
    # 1. English note: refer to README.md for configuration guidance.
    {% if printer.extruder.can_extrude %}
        M83
        G1 E{retract_len} F2100      ; 
    {% endif %}
    
    # 2. English note: refer to README.md for configuration guidance.
    # MOVE=1 English note: refer to README.md for configuration guidance.
    RESTORE_GCODE_STATE NAME=PAUSE_state MOVE=1 MOVE_SPEED=150
    
    M118 [System] Preparing to resume printing...
    BASE_RESUME
    
[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
  TURN_OFF_HEATERS
  CANCEL_PRINT_BASE
  G91
  G1 Z10 F600 ; 10mm
  UNTOOL
  M106 S0
[force_move]
enable_force_move: True
