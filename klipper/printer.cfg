    {% set cfg_start_x = params.START_X|default(10.0)|float %}  # English note: see README.md for parameter guidance.
    {% set cfg_start_y = params.START_Y|default(5.0)|float %}  # English note: see README.md for parameter guidance.
    {% set cfg_offset_y = params.OFFSET_Y|default(2.0)|float %}  # English note: see README.md for parameter guidance.
    {% set cfg_length = params.LENGTH|default(50.0)|float %}  # English note: see README.md for parameter guidance.
    {% set cfg_pre_extrude = params.PRE_EXTRUDE|default(3.0)|float %}  # English note: see README.md for parameter guidance.
    {% set cfg_retract = 0 %}  # English note: see README.md for parameter guidance.
    
    {% set cfg_speed_xy = 24000 %}  # English note: see README.md for parameter guidance.
    {% set cfg_speed_z = 3000 %}  # English note: see README.md for parameter guidance.
    
    # ==========================================
    # 2. English note: refer to README.md for configuration guidance.
    # ==========================================
    {% set BED_TEMP = params.BED|default(60)|float %}  # English note: see README.md for parameter guidance.
    {% set INITIAL_TOOL = params.INITIAL_TOOL|default("0")|string %}  # English note: see README.md for parameter guidance.
    
    {% set ns = namespace(tools="", temps="") %}
    
    # English note: refer to README.md for configuration guidance.
    {% for i in range(5) %}
        {% set temp_key = 'T' ~ i ~ '_TEMP' %}
        {% set used_key = 'T' ~ i ~ '_USED' %}
        
        # English note: refer to README.md for configuration guidance.
        {% set ext_name = "extruder" if i == 0 else "extruder" ~ i %}
        
        # English note: refer to README.md for configuration guidance.
        {% if temp_key in params and ext_name in printer.heaters.available_heaters %}
            {% set t_val = params[temp_key]|float %}
            
            # English note: refer to README.md for configuration guidance.
            {% set is_used = params[used_key]|default("1")|string|lower %}
            
            # English note: refer to README.md for configuration guidance.
            {% if t_val > 0 and (is_used == "1" or is_used == "true") %}
                {% set ns.tools = ns.tools ~ i ~ "," %}
                {% set ns.temps = ns.temps ~ t_val ~ "," %}
            {% endif %}
        {% endif %}
    {% endfor %}

    # English note: refer to README.md for configuration guidance.
    {% set tool_list = ns.tools.strip(',').split(',') %}
    {% set temp_list = ns.temps.strip(',').split(',') %}

    # English note: refer to README.md for configuration guidance.
    {% if tool_list|length == 1 and tool_list[0] == "" %}
        {% set tool_list = [INITIAL_TOOL] %}
        {% set temp_list = [200.0] %}
    {% endif %}

    # ==========================================
    # 3. English note: refer to README.md for configuration guidance.
    # ==========================================
    BED_MESH_CLEAR  # English note: see README.md for parameter guidance.
    M140 S{BED_TEMP}  # English note: see README.md for parameter guidance.
    G28  # English note: see README.md for parameter guidance.
    Z_TILT_ADJUST  # English note: see README.md for parameter guidance.
    G28 Z  # English note: see README.md for parameter guidance.
    G1 Z20 F{cfg_speed_z}  # English note: see README.md for parameter guidance.
    BED_MESH_PROFILE LOAD=default  # English note: see README.md for parameter guidance.
    M190 S{BED_TEMP}  # English note: see README.md for parameter guidance.

    # ==========================================
    # 4. English note: refer to README.md for configuration guidance.
    # ==========================================
    # English note: refer to README.md for configuration guidance.
    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M104 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    # English note: refer to README.md for configuration guidance.
    {% for i in range(tool_list|length) %}
        {% if tool_list[i] != "" and temp_list[i] != "" %}
            M109 S{temp_list[i]} T{tool_list[i]}
        {% endif %}
    {% endfor %}

    # ==========================================
    # 5. English note: refer to README.md for configuration guidance.
    # ==========================================
    SAVE_GCODE_STATE NAME=print_start_state  # English note: see README.md for parameter guidance.
    G90  # English note: see README.md for parameter guidance.
    G92 E0  # English note: see README.md for parameter guidance.

    # ns_line English note: refer to README.md for configuration guidance.
    {% set ns_line = namespace(line_index=0) %}

    # ----- English note: refer to README.md for configuration guidance.
    {% for tool in tool_list %}
        # English note: refer to README.md for configuration guidance.
        {% if tool != "" and tool != INITIAL_TOOL %}
            T{tool}  # English note: see README.md for parameter guidance.
            # English note: refer to README.md for configuration guidance.
            {% set current_y = cfg_start_y + (ns_line.line_index * cfg_offset_y) %}
            
            G1 Z5.0 F{cfg_speed_z}  # English note: see README.md for parameter guidance.
            G1 X{cfg_start_x} Y{current_y} F{cfg_speed_xy}  # English note: see README.md for parameter guidance.
            G1 Z0.28 F1500  # English note: see README.md for parameter guidance.
            
            G91  # English note: see README.md for parameter guidance.
            G1 E{cfg_pre_extrude} F300  # English note: see README.md for parameter guidance.
            G1 X{cfg_length * 0.6} E{cfg_length * 0.12} F1000  # English note: see README.md for parameter guidance.
            G1 X{cfg_length * 0.4} E{cfg_length * 0.05} F1500  # English note: see README.md for parameter guidance.
            G1 E-{cfg_retract} F2100  # English note: see README.md for parameter guidance.
            G1 Z2.0 F{cfg_speed_z}  # English note: see README.md for parameter guidance.
            
            G90  # English note: see README.md for parameter guidance.
            G92 E0  # English note: see README.md for parameter guidance.
            M104 S0 T{tool}  # English note: see README.md for parameter guidance.
            {% set ns_line.line_index = ns_line.line_index + 1 %}
        {% endif %}
    {% endfor %}

    # ----- English note: refer to README.md for configuration guidance.
    # English note: refer to README.md for configuration guidance.
    {% if INITIAL_TOOL in tool_list %}
        T{INITIAL_TOOL}  # English note: see README.md for parameter guidance.
        {% set current_y = cfg_start_y + (ns_line.line_index * cfg_offset_y) %}
        
        G1 Z5.0 F{cfg_speed_z}
        G1 X{cfg_start_x} Y{current_y} F{cfg_speed_xy}
        G1 Z0.28 F1500
        
        G91
        G1 E{cfg_pre_extrude} F300 
        G1 X{cfg_length * 0.6} E{cfg_length * 0.12} F1000 
        G1 X{cfg_length * 0.4} E{cfg_length * 0.05} F1500 
        G1 E-{cfg_retract} F2100  # English note: see README.md for parameter guidance.
        G1 Z2.0 F{cfg_speed_z}
        
        G90
        G92 E0
        # English note: refer to README.md for configuration guidance.
    {% endif %}

    # ==========================================
    # 6. English note: refer to README.md for configuration guidance.
    # ==========================================
    RESTORE_GCODE_STATE NAME=print_start_state  # English note: see README.md for parameter guidance.
    
    # English note: refer to README.md for configuration guidance.
    {% if INITIAL_TOOL in tool_list %}
        {% set svv = printer.save_variables.variables %}
        {% set off_x = svv["t" ~ INITIAL_TOOL ~ "_offset_x"] | default(0.0) | float %}
        {% set off_y = svv["t" ~ INITIAL_TOOL ~ "_offset_y"] | default(0.0) | float %}
        {% set off_z = svv["t" ~ INITIAL_TOOL ~ "_offset_z"] | default(0.0) | float %}
        
        SET_GCODE_OFFSET X={off_x} Y={off_y} Z={off_z} MOVE=0
        
        { action_respond_info("Initial tool T" ~ INITIAL_TOOL ~ " offsets loaded from external file: X=" ~ off_x ~ " Y=" ~ off_y ~ " Z=" ~ off_z) }
    {% endif %}

    { action_respond_info("Priming line complete. Current tool is T" ~ INITIAL_TOOL ~ "; ready to print!") }
#--------------------------------------------------------------------
[gcode_macro PRINT_END]
description: English-language macro description; see README.md.
gcode:
    # 1. English note: refer to README.md for configuration guidance.
    {% set max_x = printer.configfile.config["stepper_x"]["position_max"]|float %}
    {% set max_y = printer.configfile.config["stepper_y"]["position_max"]|float %}
    {% set max_z = printer.configfile.config["stepper_z"]["position_max"]|float %}
    
    # 2. English note: refer to README.md for configuration guidance.
    UNTOOL
    SET_GCODE_OFFSET X=0 Y=0 Z=0 

    M400  # English note: see README.md for parameter guidance.
    G92 E0  # English note: see README.md for parameter guidance.
    
    # 3. English note: refer to README.md for configuration guidance.
    G91  # English note: see README.md for parameter guidance.
    # English note: refer to README.md for configuration guidance.
    {% if printer.toolhead.position.z < (max_z - 5) %}
        G0 Z5 F3600 
    {% endif %}
    
    # 4. English note: refer to README.md for configuration guidance.
    M104 S0 T0                        
    M104 S0 T1                        
    M104 S0 T2                        
    M104 S0 T3                        
    M140 S0  # English note: see README.md for parameter guidance.
    M106 S0  # English note: see README.md for parameter guidance.
    
    # 5. English note: refer to README.md for configuration guidance.
    G90  # English note: see README.md for parameter guidance.
    {% set safe_z = max_z - 30 %}
    
    G0 X{max_x-5} Y{max_y-5} Z{safe_z} F6000
    
    # 6. English note: refer to README.md for configuration guidance.
    M400  # English note: see README.md for parameter guidance.
    BED_MESH_CLEAR  # English note: see README.md for parameter guidance.
    # M84                             # English note: refer to README.md for configuration guidance.
    
    { action_respond_info("Print complete. Bed lowered; remove the part.") }

