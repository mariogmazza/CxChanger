# CxChanger calibration configuration - Voron adaptation
# Based on viesturz/klipper-toolchanger tools_calibrate.
# EXAMPLE sensor pin and fixture coordinates: measure and replace for your printer.
# This is the legacy macro + SET_GCODE_OFFSET architecture; do not mix with a modern
# registered-tool transform architecture without migrating the whole toolchanger.

[tools_calibrate]
pin: ^PD11                     # EXAMPLE ONLY: contact calibrator switch input
travel_speed: 15                # mm/s sideways between probe steps
spread: 4.5                     # mm; tune to physical target/nozzle diameter
lower_z: 0.6                    # mm downstroke; tune conservatively
speed: 2                        # mm/s probe motion
lift_speed: 4                   # mm/s; verify adequate for actual tool Z differences
final_lift_z: 1                 # mm after probe sequence; check clearance
sample_retract_dist: 2          # mm retract between samples
samples_tolerance: 0.1          # mm maximum tolerated sample spread
samples: 5
samples_result: median

[gcode_macro _TOOL_CALIB_VARS]
variable_sensor_x: 112.5        # MEASURE: calibrator center X
variable_sensor_y: -4.0         # MEASURE: calibrator center Y
variable_safe_x: 112.0          # MEASURE: safe staging X outside dock array
variable_safe_y: 10.0           # MEASURE: safe staging Y outside dock array
variable_safe_z: 10.0           # MEASURE: safe staging Z for your frame
variable_tool_count: 4
variable_motion_calibration_enabled: 0
gcode:
    # Storage only. Calibration is disabled until fixture coordinates and keep-out areas are verified.

[gcode_macro CALIBRATE_TOOL]
description: Calibrate CxChanger tool offset (T0 reference first)
gcode:
    {% set tool = params.TOOL|default(0)|int %}
    {% set v = printer["gcode_macro _TOOL_CALIB_VARS"] %}
    {% if v.motion_calibration_enabled|int != 1 %}
        { action_raise_error("Calibration motion is disabled. Verify sensor/safe coordinates, then set motion_calibration_enabled=1.") }
    {% elif 'xyz' not in printer.toolhead.homed_axes %}
        { action_raise_error("Calibration requires XYZ homed.") }
    {% elif tool < 0 or tool >= v.tool_count|int %}
        { action_raise_error("Invalid tool index for calibration (expected 0-3).") }
    {% else %}
        G90
        G1 Z{v.safe_z} F600
        G1 X{v.safe_x} Y{v.safe_y} F3000
        T{tool}
        G1 Z{v.safe_z} F600
        G1 X{v.sensor_x} Y{v.sensor_y} F3000
        {% if tool == 0 %}
            { action_respond_info("Locating the T0 reference sensor center.") }
            TOOL_LOCATE_SENSOR
            M400
            G4 P500
            SAVE_VARIABLE VARIABLE=t0_offset_x VALUE=0.0
            SAVE_VARIABLE VARIABLE=t0_offset_y VALUE=0.0
            SAVE_VARIABLE VARIABLE=t0_offset_z VALUE=0.0
        {% else %}
            { action_respond_info("Measuring XYZ offset for T" ~ tool ~ ".") }
            TOOL_CALIBRATE_TOOL_OFFSET
            M400
            _SAVE_CX_TOOL_OFFSET TOOL={tool}
        {% endif %}
        M400
        G90
        G1 Z{v.safe_z} F600
        G1 X{v.safe_x} Y{v.safe_y} F3000
        UNTOOL
    {% endif %}

[gcode_macro _SAVE_CX_TOOL_OFFSET]
description: Save tool offset from current tools_calibrate result fields
gcode:
    {% set tool = params.TOOL|int %}
    {% set x = printer.tools_calibrate.last_x_result|float %}
    {% set y = printer.tools_calibrate.last_y_result|float %}
    {% set z = printer.tools_calibrate.last_z_result|float %}
    SAVE_VARIABLE VARIABLE=t{tool}_offset_x VALUE={x|round(6)}
    SAVE_VARIABLE VARIABLE=t{tool}_offset_y VALUE={y|round(6)}
    SAVE_VARIABLE VARIABLE=t{tool}_offset_z VALUE={z|round(6)}
    { action_respond_info("Saved T" ~ tool ~ " offset: X=" ~ x ~ " Y=" ~ y ~ " Z=" ~ z) }

[gcode_macro CALIBRATE_ALL_TOOLS]
description: Calibrate all configured CxChanger tools; T0 becomes the reference
gcode:
    {% set v = printer["gcode_macro _TOOL_CALIB_VARS"] %}
    {% if v.motion_calibration_enabled|int != 1 %}
        { action_raise_error("Calibration motion is disabled. Verify coordinates then set motion_calibration_enabled=1.") }
    {% else %}
        {% for t in range(0, v.tool_count|int) %}
            CALIBRATE_TOOL TOOL={t}
        {% endfor %}
        { action_respond_info("CxChanger calibration loop completed. Inspect console and verify a test print before production.") }
    {% endif %}
